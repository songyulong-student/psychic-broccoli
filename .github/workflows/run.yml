name: StockDesk Auto Scan
on:
  schedule:
    - cron: '0 12 * * 1-5' # 每天美东中午12点（日经收盘/美股盘前）
  workflow_dispatch:      # 允许你随时手动点按钮测试

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Scan
        run: python stockdesk.py
